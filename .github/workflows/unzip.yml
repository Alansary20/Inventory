name: unzip
on:
  push:
    paths:
      - 'jard_web_v2.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -oq jard_web_v2.zip
          cp -r web/. .
          rm -rf web jard_web_v2.zip
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "unzip site" || exit 0
          git push
